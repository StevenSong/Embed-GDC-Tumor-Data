services:
  triton:
    image: nvcr.io/nvidia/tritonserver:25.01-py3
    volumes:
      - ./model-repo:/models
    ports:
      - 8000:8000
      - 8001:8001
      - 8002:8002
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${CUDA_VISIBLE_DEVICES}']
              capabilities: [gpu]
    command:
      - tritonserver
      - --model-repository=/models
      - --grpc-port=8001
      - --http-port=8000
  preprocessor:
    build:
      context: preprocessor/
      dockerfile: Dockerfile
    volumes:
      - ./sample:/sample
      - ./out:/out
    ports:
      - 8080:8080
    command: # entrypoint is already python main.py
      - --model_name virchow
      - --predictor_host triton:8001
      - --protocol=v2
      - --tile_batch 32 # tune me!
      - --concurrent_calls_to_predictor 8 # tune me!
      - --num_tile_readers 4 # tune me!
      - --queue_depth 16 # tune me!

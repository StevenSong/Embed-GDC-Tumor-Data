# Builds every embedding image under the tags the sbatch launchers run by default.
# Build-only: jobs are run with `docker run` from the sbatch scripts, not `compose up`.
#
#   HF_TOKEN=hf_xxx docker compose build   # all images
#   docker compose build gemma             # just one
#
# ctds-rnaseq bakes in weights from CTDS_RNASEQ_WEIGHTS, an omics-encoder
# checkout (the repo root, not kserve-demo/), by default external/omics-encoder.
#
# HF_TOKEN is only needed for virchow (paige-ai/Virchow is gated); it is passed as
# a BuildKit secret, never a build arg, so it stays out of the image history.

services:
  virchow:
    image: virchow-embedder:latest
    build:
      context: embed/virchow
      secrets:
        - hf_token

  gemma:
    image: gemma-embedder:latest
    build:
      context: embed/gemma

  ctds-rnaseq:
    image: ctds-rnaseq-embedder:latest
    build:
      context: embed/ctds-rnaseq
      additional_contexts:
        # weights are baked in from here, never committed; see embed/ctds-rnaseq/README.md
        weights: ${CTDS_RNASEQ_WEIGHTS:-external/omics-encoder}

secrets:
  hf_token:
    environment: HF_TOKEN
